# Nginx / process notes for Cheterin on Oracle (cheterin.online).
# Canonical Lookup proxy detail: ../lookup-api/PROXY.md
# Bot+dashboard + Lookup update: ../update.sh → scripts/update.sh
#   (builds both frontends; systemctl restart cheterin-bot + cheterin-lookup).
# Unit files: ./systemd/  (replaces legacy tmux chetmain / chetlookup).

# Typical path split (same host, no CORS):
#   /api/*           → dashboard aiohttp (main.py / cheterin-bot.service)
#   /                → dashboard/frontend/dist SPA
#   = /lookup        → 301 /lookup/  (Vite base is /lookup/; bare path 404s without this)
#   /lookup/         → lookup/dist static
#   /api/lookup/     → 127.0.0.1:8090 (lookup-api / cheterin-lookup.service)
#
# Required snippet (see lookup-api/PROXY.md):
#   location = /lookup { return 301 /lookup/$is_args$args; }
#   location /lookup/ { alias …/lookup/; try_files $uri $uri/ /lookup/index.html; }
# Then: sudo nginx -t && sudo systemctl reload nginx
