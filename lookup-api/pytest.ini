[pytest]
asyncio_mode = auto
testpaths = tests
# So `from app import …` works in CI and locally (importlib mode does not put rootdir on sys.path).
pythonpath = .
filterwarnings =
    ignore:Changing state of started or joined application is deprecated:DeprecationWarning
    ignore:It is recommended to use web.AppKey:aiohttp.web_exceptions.NotAppKeyWarning
