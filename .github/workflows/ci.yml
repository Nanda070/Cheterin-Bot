name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dashboard-backend:
    name: Dashboard backend (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run pytest
        run: pytest -q

  lookup-api:
    name: Lookup API (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lookup-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: lookup-api/requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run pytest
        run: pytest -q
        # No Discord tokens required — tests use fakes / TokenPool units.

  dashboard-frontend:
    name: Dashboard frontend (build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: dashboard/frontend/package-lock.json
      - name: Install
        run: npm ci
      - name: Typecheck + production build
        run: npm run build

  lookup-frontend:
    name: Lookup SPA (build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lookup
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: lookup/package-lock.json
      - name: Install
        run: npm ci
      - name: Typecheck + production build
        run: npm run build
